# Global runtimes and tools, installed by `mise install` (install.sh runs it).
# Add one with `mise use -g <tool>@latest` (it edits this file), then commit it.
[tools]
bat = "latest"
fd = "latest"
gh = "latest"
lazydocker = "latest"
lazygit = "latest"
node = "lts" # Neovim's Mason installs several language servers with npm
